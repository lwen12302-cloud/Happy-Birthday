                Happy Birthday xxx!

                color: #666;
                letter-spacing: 5px;

                Wishing you the best day ever

        </div>
    </div>

        const { Engine, Render, Runner, Bodies, Composite } = Matter;

        function showBirthdayText() {
            // 1. 寻找新版的 ID 容器
            const container = document.getElementById('birthday-container');
            const card = document.getElementById('birthday-card');

            // 2. 加一个安全检查，如果还没加载出来就不会报错
            if (!container || !card) {
                console.error("找不到生日卡片容器，请检查 HTML 的 ID");
                return;
            }

            // 3. 显示外层毛玻璃容器
            container.style.display = 'flex';
            
            // 4. 这一步很关键：强制浏览器重绘，否则动画不会生效
            void container.offsetWidth;

            // 5. 触发卡片的入场动画（透明度变1，位移清零）
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) rotateX(0)';
        }



        let autoExplodeTimer = null; // 用于保存定时器，方便随时开启或停止

        // 开启底部随机爆炸喷泉startPopcornFountain(canvasWidth, canvasHeight, interval = 300)
        // 参数：canvasWidth (屏幕宽度), canvasHeight (屏幕高度), interval (爆炸间隔毫秒)
        function startPopcornFountain(canvasWidth, canvasHeight, interval = 300) {
            // 防止重复开启定时器
            if (autoExplodeTimer) clearInterval(autoExplodeTimer);

            autoExplodeTimer = setInterval(() => {
                // 1. X 坐标：在屏幕宽度内完全随机
                const randomX = Math.random() * canvasWidth;
                
                // 2. Y 坐标：设置在屏幕最底部，甚至可以再往下一点 (例如 canvasHeight + 50)
                // 这样爆炸的冲击波主要是向上的，能完美实现“抛起”效果
                const bottomY = canvasHeight + 20; 

                // 3. 触发爆炸，强度可以自己微调
                const popStrength = 2.4; 
                explode(randomX, bottomY, popStrength);

            }, interval); // 每 interval 毫秒炸一次
        }

        function explode(x, y, strength) {
            const bodies = Composite.allBodies(engine.world);

            bodies.forEach(body => {
                // 【关键修复】不要对静态物体（墙壁、地板）施加力，否则物理世界会出bug
                if (body.isStatic) return;

                const bodyX = body.position.x;
                const bodyY = body.position.y;

                let dx = bodyX - x;
                let dy = bodyY - y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 1000 && distance > 0) {
                    // 核心算法：平方衰减
                    const force = (strength * 500) / (distance * distance); 

                    const fx = (dx / distance) * force * body.mass;
                    const fy = (dy / distance) * force * body.mass;

                    Body.applyForce(body, body.position, { x: fx, y: fy });
                    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.2);
                }
            });
        }

        // 2. 创建物理引擎
        const engine = Engine.create({
            positionIterations: 150,
            constraintIterations: 10,
            positionIterations: 100// 默认是 6，调到 20 甚至更高可以极大缓解“变扁”现象
        });

        // 3. 创建渲染器，它会自动在 body 里生成一个 <canvas> 画布
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                // 使用窗口的内部宽度和高度
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                // 可选：设置背景颜色
                background: '#fffff0' 
            }
        });




        const thickness = 50; // 墙的厚度
        const offset = 20;
        const wallOptions = {
            isStatic: true,           // 墙壁不动
            render: { visible: false }, // 不可见
            friction: 1,              // 增加摩擦力
            restitution: 0,           // 没有弹性（撞上去不反弹，防止弹飞）
            density: 1000             // 增加密度（虽然是静止的，但在某些碰撞计算中有帮助）
        };

        const bottomWall = Bodies.rectangle(
            window.innerWidth / 2,       // 1. x 坐标（中心点）
            window.innerHeight + thickness / 2, // 2. y 坐标（中心点）
            window.innerWidth+100,           // 3. 宽度
            thickness,                   // 4. 高度
            wallOptions                  // 5. 配置选项（如静止、不可见）
        );
        const leftWall = Bodies.rectangle(
            0 - thickness / 2,           // 1. x 坐标（中心点）
            window.innerHeight / 2,      // 2. y 坐标（中心点）
            thickness,                   // 3. 宽度
            window.innerHeight+50,          // 4. 高度
            wallOptions                  // 5. 配置选项（如静止、不可见）
        );
        const rightWall = Bodies.rectangle(
            window.innerWidth + thickness / 2, // 1. x 坐标（中心点）
            window.innerHeight / 2,      // 2. y 坐标（中心点）
            thickness,                   // 3. 宽度
            window.innerHeight+50,          // 4. 高度
            wallOptions                  // 5. 配置选项（如静止、不可见）
        );
        Composite.add(engine.world, [bottomWall, leftWall, rightWall]);

        const reversedData = [...data].reverse();
        const flatData = reversedData.flat(); 
        const cols = data[0].length; // 获取图片的宽度（列数）

        let currentIndex = 0;
        const speed = 10; // 生成速度：每 10 毫秒生成一个

        const timer = setInterval(() => {
            if (currentIndex >= flatData.length) {
                clearInterval(timer); // 全部生成完后停止定时器
                console.log("图像生成完毕！");
                return;
            }
 

            // 计算当前像素在矩阵中的行列位置
            const r = Math.floor(currentIndex / cols); // 当前行
            const c = currentIndex % cols;            // 当前列
            const pixelColor = flatData[currentIndex];

            // 3. 创建方块
            const box = Bodies.rectangle(
                330 + (c * 22), 
                -20, 
                20, 20, 
                {
                    restitution: 0.6,
                    friction: 0.1,
                    density: 0.002,
                    render: { fillStyle: pixelColor }
                }
            );

            Composite.add(engine.world, box);
            
            currentIndex++; // 下一个
        }, speed);
        render.canvas.addEventListener('mousedown', function(event) {
            const rect = render.canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            startPopcornFountain(window.innerWidth, window.innerHeight, interval = 300)
            explode(mouseX, mouseY, 3);
            
        });
        showBirthdayText();







        Render.run(render);
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });
        const runner = Runner.create();
        Runner.run(runner, engine);
        
    </script>
